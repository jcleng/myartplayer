services:
  frankenphp:
    image: registry.cn-hangzhou.aliyuncs.com/jcleng/dunglas-frankenphp
    container_name: frankenphp
    environment:
      - "TIMEZONE=Asia/Shanghai"
      - "VIDEO_DIR=/home/jcleng/work/mywork/myartplayer/.vscode/"
    # https://localhost:12356/
    ports:
      - "12356:443"
    volumes:
      - .:/app/public
      - ./Caddyfile:/etc/frankenphp/Caddyfile
      - "/home/jcleng/work/mywork:/home/jcleng/work/mywork"
