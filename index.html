<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>视频墙</title>
<script src="/static/artplayer.js"></script>
<script src="/static/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:80px}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 100%);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(90deg,#23ade5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .count{font-size:13px;color:#888;background:rgba(255,255,255,.06);padding:4px 12px;border-radius:20px;white-space:nowrap}
.header .tabs{display:flex;gap:8px;align-items:center;order:3;width:100%}
.header .tab{padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid transparent;color:#aaa;font-size:13px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;flex:1;max-width:140px}
.header .tab.active{background:rgba(35,173,229,.2);color:#23ade5;border-color:rgba(35,173,229,.4);font-weight:600}
@media(min-width:640px){.header .tabs{order:initial;width:auto}.header .tab{flex:none}}
.video-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px;max-width:1200px;margin:0 auto}
@media(min-width:640px){.video-wall{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:20px}}
.video-card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#14141f;transition:transform .25s ease,box-shadow .25s ease;aspect-ratio:2/3}
.video-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(35,173,229,.2)}
.video-card:active{transform:scale(.97)}
.video-card .poster{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.video-card:hover .poster{transform:scale(1.05)}
.video-card .overlay{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.85));pointer-events:none}
.video-card .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(35,173,229,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease;pointer-events:none}
.video-card .play-icon::after{content:'';display:block;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #fff;margin-left:4px}
.video-card:hover .play-icon{opacity:1}
.video-card .title{position:absolute;bottom:0;left:0;right:0;padding:12px;font-size:13px;font-weight:600;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-card .subtitle{position:absolute;top:8px;right:8px;font-size:11px;color:#23ade5;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:10px;pointer-events:none}
.video-card .fav-btn{position:absolute;top:8px;left:8px;z-index:2;width:30px;height:30px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#bbb;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,transform .15s;pointer-events:auto}
.video-card .fav-btn.on{color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,.6)}
.video-card .fav-btn:active{transform:scale(.8)}
.empty-hint{grid-column:1/-1;text-align:center;padding:40px 20px;color:#777;font-size:14px;line-height:1.8}
.loading{text-align:center;padding:60px 20px;color:#666}
.loading .spinner{width:40px;height:40px;border:3px solid rgba(35,173,229,.15);border-top-color:#23ade5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:14px}
.error{text-align:center;padding:60px 20px;color:#888;font-size:14px;line-height:1.8}
.error .retry{display:inline-block;margin-top:12px;padding:8px 24px;background:#23ade5;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.player-section{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.player-section{padding:0 20px}}
.player-section.hidden{display:none}
.player-section .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:16px}
.player-section .player-wrap .artplayer-app{width:100%;height:100%}
.player-section .player-wrap video{width:100%;height:100%;display:block;object-fit:contain}
.player-section .player-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 0}
.player-section .player-bar .video-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:12px}
.player-section .player-bar .close-btn{flex-shrink:0;padding:6px 16px;background:rgba(255,255,255,.08);border:none;color:#aaa;font-size:13px;border-radius:8px;cursor:pointer;transition:background .2s}
.player-section .player-bar .close-btn:hover{background:rgba(255,255,255,.15);color:#fff}
</style>
</head>
<body>
<div class="header">
  <h1>🎬 视频墙</h1>
  <div class="tabs">
    <button class="tab active" id="tabAll" onclick="switchView('all')">全部</button>
    <button class="tab" id="tabFav" onclick="switchView('fav')">收藏夹</button>
  </div>
  <span class="count" id="videoCount">0 部</span>
</div>
<div class="player-section hidden" id="playerSection">
  <div class="player-bar">
    <span class="video-title" id="playerTitle"></span>
    <button class="close-btn" onclick="closePlayer()">关闭</button>
  </div>
  <div class="player-wrap">
    <div class="artplayer-app" id="artplayerContainer"></div>
  </div>
</div>
<div class="video-wall" id="videoWall"></div>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>正在加载视频列表...</p>
</div>
<div class="error" id="error" style="display:none">
  <p>加载失败，请检查网络连接</p>
  <button class="retry" onclick="loadVideos()">重试</button>
</div>
<script>
let art = null
let nativeVideo = null
let allVideos = []
let favSet = new Set()
let viewMode = 'all'
let favReady = false

function closePlayer() {
  if (art) { art.destroy(); art = null }
  if (nativeVideo) { nativeVideo.pause(); nativeVideo.src = ''; nativeVideo = null }
  document.getElementById('playerSection').classList.add('hidden')
}

async function loadVideos() {
  const wall = document.getElementById('videoWall')
  const loading = document.getElementById('loading')
  const errorEl = document.getElementById('error')
  loading.style.display = 'block'
  errorEl.style.display = 'none'

  try {
    const resp = await fetch('palayer.php?_=' + Date.now(), { cache: 'no-cache' })
    if (!resp.ok) throw new Error('HTTP ' + resp.status)
    const data = await resp.json()
    loading.style.display = 'none'
    allVideos = Array.isArray(data) ? data : (data && Array.isArray(data.videos) ? data.videos : [])
    await loadFavorites()
    renderWall()
  } catch (e) {
    loading.style.display = 'none'
    errorEl.style.display = 'block'
    console.error('Load failed:', e)
  }
}

async function loadFavorites() {
  try {
    const resp = await fetch('palayer.php?fav', { cache: 'no-cache' })
    if (!resp.ok) throw new Error('HTTP ' + resp.status)
    const data = await resp.json()
    const files = Array.isArray(data) ? data : (data && Array.isArray(data.files) ? data.files : [])
    favSet = new Set(files)
  } catch (e) {
    favSet = new Set()
    console.error('收藏列表加载失败:', e)
  }
  favReady = true
}

function currentList() {
  return viewMode === 'fav' ? allVideos.filter(v => favSet.has(v.file)) : allVideos
}

function renderWall() {
  const wall = document.getElementById('videoWall')
  const loading = document.getElementById('loading')
  loading.style.display = 'none'
  const list = currentList()
  wall.innerHTML = ''
  document.getElementById('videoCount').textContent = list.length + ' 部'
  if (viewMode === 'fav' && list.length === 0) {
    const hint = document.createElement('div')
    hint.className = 'empty-hint'
    hint.textContent = '收藏夹是空的\n点击视频卡片左上角的 ☆ 即可收藏'
    wall.appendChild(hint)
    return
  }
  list.forEach(v => wall.appendChild(createCard(v)))
}

function switchView(mode) {
  viewMode = mode
  document.getElementById('tabAll').classList.toggle('active', mode === 'all')
  document.getElementById('tabFav').classList.toggle('active', mode === 'fav')
  renderWall()
}

function createCard(v) {
  const card = document.createElement('div')
  card.className = 'video-card'
  card.dataset.url = v.url || ''

  const isFav = favSet.has(v.file)
  const favBtn = document.createElement('button')
  favBtn.className = 'fav-btn' + (isFav ? ' on' : '')
  favBtn.textContent = isFav ? '★' : '☆'
  favBtn.title = isFav ? '取消收藏' : '收藏'
  favBtn.addEventListener('click', function(e) {
    e.stopPropagation()
    toggleFav(v, favBtn)
  })

  let poster = null
  if (v.poster) {
    poster = document.createElement('img')
    poster.className = 'poster'
    poster.alt = ''
    poster.referrerPolicy = 'no-referrer'
    poster.onerror = function() { poster.remove(); poster = null }
    poster.src = v.poster
  }

  const overlay = document.createElement('div')
  overlay.className = 'overlay'

  const playIcon = document.createElement('div')
  playIcon.className = 'play-icon'

  const title = document.createElement('div')
  title.className = 'title'
  title.textContent = v.title || ''

  if (v.subtitle) {
    const sub = document.createElement('div')
    sub.className = 'subtitle'
    const subs = Array.isArray(v.subtitle) ? v.subtitle : [v.subtitle]
    sub.textContent = subs.map(s => typeof s === 'object' ? (s.title || s.label) : (String(s).split('/').pop() || 'SUB')).join(' / ')
    card.appendChild(sub)
  }

  card.appendChild(favBtn)
  if (poster) card.appendChild(poster)
  card.append(overlay, playIcon, title)

  card.addEventListener('click', () => openPlayer(v))
  return card
}

function setFavBtn(btn, v) {
  const isFav = favSet.has(v.file)
  btn.className = 'fav-btn' + (isFav ? ' on' : '')
  btn.textContent = isFav ? '★' : '☆'
  btn.title = isFav ? '取消收藏' : '收藏'
}

async function toggleFav(v, btn) {
  const target = !favSet.has(v.file)
  if (target) favSet.add(v.file); else favSet.delete(v.file)
  setFavBtn(btn, v)
  if (viewMode === 'fav' && !target) renderWall()
  document.getElementById('videoCount').textContent = currentList().length + ' 部'
  try {
    const resp = await fetch('palayer.php?fav', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: v.file, fav: target }),
    })
    if (!resp.ok) throw new Error('HTTP ' + resp.status)
    const data = await resp.json()
    if (!data || data.ok !== true) throw new Error('服务器返回异常')
  } catch (e) {
    if (target) favSet.delete(v.file); else favSet.add(v.file)
    setFavBtn(btn, v)
    if (viewMode === 'fav' && target) renderWall()
    document.getElementById('videoCount').textContent = currentList().length + ' 部'
    console.error('收藏操作失败:', e)
  }
}

function openPlayer(v) {
  closePlayer()
  const titleEl = document.getElementById('playerTitle')
  titleEl.textContent = v.title || ''
  var wrap = document.getElementById('artplayerContainer')
  document.getElementById('playerSection').classList.remove('hidden')
  window.scrollTo(0, 0)

  if (window.Artplayer) {
    try {
      var config = {
        container: wrap,
        fastForward: true,
        url: v.url || '',
        poster: '',
        title: v.title || '',
        volume: 0.5,
        isLive: false,
        muted: false,
        autoplay: true,
        pip: true,
        autoSize: false,
        autoMini: false,
        screenshot: true,
        setting: true,
        loop: false,
        flip: true,
        playbackRate: true,
        aspectRatio: true,
        fullscreen: true,
        fullscreenWeb: true,
        miniProgressBar: true,
        mutex: true,
        backdrop: true,
        playsInline: true,
        airplay: true,
        theme: '#23ade5',
        lang: navigator.language.toLowerCase(),
        moreVideoAttr: {
          disablePictureInPicture: true,
          controlsList: 'nodownload noplaybackrate noremoteplayback',
        },
      }

      if (v.thumbnails && v.thumbnails.url) {
        config.thumbnails = {
          url: v.thumbnails.url,
          number: v.thumbnails.number || 60,
          column: v.thumbnails.column || 10,
          scale: v.thumbnails.scale || 0.85,
        }
      }

      var subData = v.subtitle
      if (subData) {
        var subs = Array.isArray(subData) ? subData : [subData]
        var selectors = [{
          html: '显示',
          tooltip: '显示',
          switch: true,
          onSwitch: function(item) {
            item.tooltip = item.switch ? '隐藏' : '显示'
            art.subtitle.show = !item.switch
            return !item.switch
          },
        }]
        subs.forEach(function(s, i) {
          var sRawUrl = typeof s === 'object' ? s.url : s
          var sLabel = typeof s === 'object' ? (s.title || s.label) : (String(sRawUrl).split('/').pop() || '字幕 ' + (i + 1))
          if (!sRawUrl) return
          selectors.push({ default: i === 0, html: sLabel, url: sRawUrl })
          if (i === 0) {
            config.subtitle = {
              url: sRawUrl,
              type: sRawUrl.match(/\.(vtt|ass|ssa)(\?|$)/i) ? 'vtt' : 'srt',
              style: { color: '#fe9200', fontSize: '20px' },
              encoding: 'utf-8',
            }
          }
        })
        if (selectors.length > 1) {
          config.settings = [{
            width: 200,
            html: '字幕',
            tooltip: '双语',
            icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="14" y2="16"/></svg>',
            selector: selectors,
            onSelect: function(item) {
              art.subtitle.switch(item.url, { name: item.html })
              return item.html
            },
          }]
        }
      }

      if (v.url && /\.m3u8(\?|$)/i.test(v.url)) {
        config.customType = {
          m3u8: function playM3u8(video, url) {
            if (Hls.isSupported()) {
              var hls = new Hls()
              hls.loadSource(url)
              hls.attachMedia(video)
              art.hls = hls
              art.on('destroy', () => hls.destroy())
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = url
            } else {
              art.notice.show = '不支持的播放格式: m3u8'
            }
          },
        }
      }

      art = new Artplayer(config)
      art.video.addEventListener('contextmenu', e => e.preventDefault())
      return
    } catch (e) {
      console.error('Artplayer failed:', e)
    }
  }

  const nv = document.createElement('video')
  nv.controls = true
  nv.autoplay = true
  nv.playsInline = true
  nv.disablePictureInPicture = true
  nv.controlsList = 'nodownload noplaybackrate noremoteplayback'
  nv.src = v.url || ''
  nv.addEventListener('contextmenu', e => e.preventDefault())
  wrap.innerHTML = ''
  wrap.appendChild(nv)
  nativeVideo = nv
}

loadVideos()
</script>
</body>
</html>
